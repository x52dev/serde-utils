[package]
name = "serde-decimal"
version = "0.2.6"
description = "Careful serialization of rust_decimal types"
categories = ["encoding"]
keywords = ["serde", "utilities", "serialization", "deserialization"]
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["serde"]
serde = ["dep:serde_core", "rust_decimal/serde-with-float", "rust_decimal/serde-with-str"]
miniserde = ["dep:miniserde"]
rust-decimal-arbitrary-precision = ["serde", "rust_decimal/serde-with-arbitrary-precision"]

[dependencies]
miniserde = { workspace = true, optional = true }
rust_decimal = { version = "1.33", default-features = false, features = ["std"] }
serde_core = { version = "1", optional = true }

[dev-dependencies]
rust_decimal_macros = "1.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
