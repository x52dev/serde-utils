[package]
name = "detrim"
version = "0.1.7"
description = "Automatic string trimming with serde or deser"
categories = ["encoding", "no-std"]
keywords = ["deserialization", "utilities", "serde"]
authors.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std", "serde"]
std = ["serde_core?/std", "deser?/std"]
serde = ["dep:serde_core"]
deser = ["dep:deser"]

[dependencies]
deser = { workspace = true, optional = true }
serde_core = { version = "1", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
deser = { workspace = true, features = ["derive"] }
deser-json = { workspace = true }
serde = { version = "1", features = ["std", "derive"] }
serde_json = "1"

[lints]
workspace = true
