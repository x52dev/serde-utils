name: Rustdoc Preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: rustdoc-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

      - name: Redirect to detrim
        run: |
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=detrim/index.html">
          HTML

      - name: Upload documentation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdoc-preview
          path: target/doc
          retention-days: 7

  deploy:
    needs: build
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && (github.event.action == 'closed' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest

    # Pages builds share gh-pages, so wait for each deployment before the next push.
    concurrency:
      group: rustdoc-preview-deploy
      cancel-in-progress: false
      queue: max

    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download documentation
        if: github.event.action != 'closed'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rustdoc-preview
          path: preview

      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: preview
          preview-branch: gh-pages
          wait-for-pages-deployment: true
          qr-code: false
          deploy-commit-message: 'docs: update PR preview'
          remove-commit-message: 'docs: remove PR preview'
