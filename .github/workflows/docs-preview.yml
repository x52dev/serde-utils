name: Rustdoc Preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: rustdoc-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (nightly)
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          toolchain: nightly

      - name: Build documentation
        env:
          RUSTDOCFLAGS: --cfg=docsrs -D warnings
        run: cargo doc --workspace --no-deps --all-features

      - name: Redirect to detrim
        run: |
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=detrim/index.html">
          HTML

      - name: Upload documentation
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rustdoc-preview
          path: target/doc
          retention-days: 7

  deploy:
    needs: build
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && (github.event.action == 'closed' || needs.build.result == 'success') }}
    runs-on: ubuntu-latest

    # Pages builds share gh-pages, so wait for each deployment before the next push.
    concurrency:
      group: rustdoc-preview-deploy
      cancel-in-progress: false
      queue: max

    permissions:
      actions: read
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download documentation
        if: github.event.action != 'closed'
        uses: actions/download-artifact@v8.0.2
        with:
          name: rustdoc-preview
          path: preview

      - name: Deploy or remove preview
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: preview
          preview-branch: gh-pages
          wait-for-pages-deployment: true
          qr-code: false
          deploy-commit-message: 'docs: update PR preview'
          remove-commit-message: 'docs: remove PR preview'
